name: cd
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  upload-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            include: jj-gh.1
          - target: aarch64-apple-darwin
            os: macos-15
            include: jj-gh.1
          - target: x86_64-apple-darwin
            os: macos-15-intel
            include: jj-gh.1
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            include: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - if: matrix.include != ''
        run: cargo run --locked --release --package gen-manpage -- > jj-gh.1
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: jj-gh
          package: jj-gh
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          include: ${{ matrix.include }}
  # Move the `stable` branch to each new release, so that a Nix flake can
  # use `github:mrjones2014/jj-gh/stable` as an input and get the latest
  # release. The push is not a force push, so it can only move the branch
  # forward. If the release commit is not a descendant of `stable`, the job
  # fails and the branch does not change.
  update-stable-branch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Git needs the full history to know that the push moves the branch
      # forward. With a shallow clone, it rejects the push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/stable
