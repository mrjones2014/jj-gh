name: cd
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  upload-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            include: jj-gh.1
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            include: jj-gh.1
          - target: aarch64-apple-darwin
            os: macos-15
            include: jj-gh.1
          - target: x86_64-apple-darwin
            os: macos-15-intel
            include: jj-gh.1
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            include: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - if: matrix.include != ''
        run: cargo run --locked --release --package gen-manpage -- > jj-gh.1
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: jj-gh
          package: jj-gh
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          include: ${{ matrix.include }}
  # Move the `stable` branch to each new release, so that a Nix flake can
  # use `github:mrjones2014/jj-gh/stable` as an input and get the latest
  # release. The push is not a force push, so it can only move the branch
  # forward. If the release commit is not a descendant of `stable`, the job
  # fails and the branch does not change.
  update-stable-branch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Git needs the full history to know that the push moves the branch
      # forward. With a shallow clone, it rejects the push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/stable
  # Build the Nix package for every flake system, push it to Cachix, and pin
  # the result. Repinning the same name with --keep-revisions 2 keeps the
  # current and previous release safe from garbage collection.
  cache-nix-packages:
    needs: [update-stable-branch]
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@v10
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: jj-gh
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      # Skip the build when Cachix already has the path (x86_64-linux is
      # normally built by CI on master for the same commit). Push explicitly
      # before pinning: the pin needs the path to already be in the cache,
      # and the cachix-action daemon pushes asynchronously.
      - run: |
          out=$(nix eval --raw .#packages.${{ matrix.system }}.default.outPath)
          if ! nix path-info --store https://jj-gh.cachix.org "$out"; then
            nix build .#packages.${{ matrix.system }}.default --print-build-logs
            cachix push jj-gh "$out"
          fi
          cachix pin jj-gh jj-gh-${{ matrix.system }} "$out" --keep-revisions 2
