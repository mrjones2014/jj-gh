query PrsWithCiStatusInternal($query: String!) {
  search(query: $query, type: ISSUE, first: 100) {
    nodes {
      __typename # required for the type generator
      ... on PullRequest {
        id
        number
        url
        title
        headRefName
        headRefOid
        headRepository {
          owner {
            __typename
            login
          }
        }
        baseRefName
        isDraft
        merged
        isInMergeQueue
        autoMergeRequest {
          enabledAt
        }
        statusCheckRollup {
          state
          # Count fields only; `first` is required by the connection but no
          # nodes are selected.
          contexts(first: 100) {
            checkRunCountsByState {
              state
              count
            }
            statusContextCountsByState {
              state
              count
            }
          }
        }
      }
    }
  }
}
